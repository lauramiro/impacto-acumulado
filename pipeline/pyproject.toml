[project]
name = "impacto"
version = "0.1.0"
description = "Pipeline for Impacto Acumulado"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "psycopg[binary]",
  "pydantic>=2",
  "rapidfuzz",
  "groq",
  "shapely",
  "python-dotenv",
  "pyshp",
  "tifffile",
  "imagecodecs",
  "pyproj",
  "numpy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
