name: extraction-eval

# Runs the extraction evaluation on a label folder and keeps the result as an
# artifact. Run by hand after labelling; the published figure is the result
# for labels_2026-10, committed as pipeline/evaluation/last_run.json.
on:
  workflow_dispatch:
    inputs:
      labels:
        description: "Label folder under pipeline/evaluation"
        required: false
        default: "labels_2026-10"
      provider:
        description: "LLM provider"
        required: false
        type: choice
        options: [mistral, groq]
        default: mistral

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    env:
      IMPACTO_DB_DSN: ${{ secrets.NEON_DSN }}
      IMPACTO_LLM_KEY: ${{ secrets.GROQ_KEY }}
      IMPACTO_MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync
      - name: eval
        env:
          LABELS: ${{ inputs.labels }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          uv run python -m impacto eval --provider "$PROVIDER" --labels "evaluation/$LABELS" --out "$RUNNER_TEMP/eval_run.json" | tee "$RUNNER_TEMP/eval_table.txt"
          { echo '```'; cat "$RUNNER_TEMP/eval_table.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-run
          path: |
            ${{ runner.temp }}/eval_run.json
            ${{ runner.temp }}/eval_run_misses.json
