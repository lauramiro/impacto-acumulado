name: weekly-pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      from:
        description: "Fetch from date (YYYY-MM-DD); default last 14 days"
        required: false
      extract_limit:
        description: "Max documents to extract this run"
        required: false
        default: "200"
      model:
        description: "LLM model id for the selected provider; when set, exported as IMPACTO_LLM_MODEL and IMPACTO_MISTRAL_MODEL (defaults: openai/gpt-oss-120b, ministral-14b-latest)"
        required: false
        default: ""
      provider:
        description: "LLM provider for the extract step (groq or mistral)"
        required: false
        type: choice
        options: [groq, mistral]
        default: groq

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

# Least privilege: each job asks for what it needs below.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    outputs:
      review_count: ${{ steps.check.outputs.count }}
    defaults:
      run:
        working-directory: pipeline
    env:
      IMPACTO_DB_DSN: ${{ secrets.NEON_DSN }}
      IMPACTO_LLM_KEY: ${{ secrets.GROQ_KEY }}
      IMPACTO_MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
      IMPACTO_HTTP_CACHE: ${{ github.workspace }}/pipeline/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pipeline/.cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - run: uv sync
      - name: select model
        if: ${{ inputs.model != '' }}
        env:
          MODEL: ${{ inputs.model }}
        run: |
          echo "IMPACTO_LLM_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "IMPACTO_MISTRAL_MODEL=$MODEL" >> "$GITHUB_ENV"
      - run: uv run python -m impacto migrate
      - name: fetch
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            uv run python -m impacto fetch --boe-consultations --from "$FROM"
          else
            uv run python -m impacto fetch --boe-consultations
          fi
      - name: extract
        # run_extract records each failed document and exits 0, and stops
        # early on an exhausted Groq daily quota without recording an
        # attempt. The per-minute backoff (up to 6 attempts per chunk, ~5
        # minutes) makes a 200-document run slow, so the step gets its own
        # generous timeout, and continue-on-error keeps resolve, aggregate
        # and export running on whatever was extracted if the step still
        # times out or crashes: a partial week is better than no export.
        timeout-minutes: 240
        continue-on-error: true
        env:
          EXTRACT_LIMIT: ${{ inputs.extract_limit || '200' }}
          PROVIDER: ${{ inputs.provider || 'groq' }}
        run: uv run python -m impacto extract --limit "$EXTRACT_LIMIT" --provider "$PROVIDER"
      - run: uv run python -m impacto resolve
      # Compares this run's groups with the last export before export
      # overwrites it. Never blocks the run: a failure here only skips the report.
      - name: resolve check
        id: check
        continue-on-error: true
        run: |
          uv run python -m impacto resolve-check --out "$RUNNER_TEMP/resolve-check.md" --count-out "$RUNNER_TEMP/resolve-check-count.txt"
          cat "$RUNNER_TEMP/resolve-check.md" >> "$GITHUB_STEP_SUMMARY"
          echo "count=$(tr -cd '0-9' < "$RUNNER_TEMP/resolve-check-count.txt")" >> "$GITHUB_OUTPUT"
      - name: keep the resolve check report
        if: steps.check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolve-check
          path: ${{ runner.temp }}/resolve-check.md
      - run: uv run python -m impacto aggregate
      - run: uv run python -m impacto export
      - name: commit exports
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "impacto-bot"
          git config user.email "impacto-bot@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: weekly export $(date -u +%F)"
            git push
          fi
